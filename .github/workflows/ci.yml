name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install panel dependencies
        run: npm --prefix panel ci

      - name: Verify OpenAPI client types (AD-14)
        run: npm --prefix panel run check:api

      - name: Run panel tests
        run: npm --prefix panel test

      - name: Build panel
        run: npm --prefix panel run build

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore CodeNetix.slnx

      - name: Build solution
        run: dotnet build CodeNetix.slnx -c Release --no-restore

      - name: Run architecture tests (AD-1)
        run: dotnet test --project tests/CodeNetix.ArchitectureTests/CodeNetix.ArchitectureTests.csproj -c Release --no-build

      - name: Build sandbox Docker image
        run: docker build -f docker/sandbox.Dockerfile -t codenetix-sandbox:latest .

      - name: Run host unit and Docker integration tests
        run: dotnet test --project tests/CodeNetix.Host.Tests/CodeNetix.Host.Tests.csproj -c Release --no-build -- --filter-not-trait Category=SecurityFire --fail-skips on

      - name: Run security fire test (Story 2.5)
        run: dotnet test --project tests/CodeNetix.Host.Tests/CodeNetix.Host.Tests.csproj -c Release --no-build -- --filter-trait Category=SecurityFire --fail-skips on

  docker-multiarch:
    runs-on: ubuntu-latest
    needs:
      - panel
      - build-and-test
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build codenetix multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/codenetix.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=codenetix
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=codenetix,ignore-error=true' || '' }}

      - name: Build codenetix-sandbox multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sandbox.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=codenetix-sandbox
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=codenetix-sandbox,ignore-error=true' || '' }}
