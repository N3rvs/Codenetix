name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate semver release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag '${TAG_NAME}'. Expected exact SemVer 2.0.0 tag vX.Y.Z without leading zeros." >&2
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install panel dependencies
        run: npm --prefix panel ci

      - name: Verify OpenAPI client types (AD-14)
        run: npm --prefix panel run check:api

      - name: Run panel tests
        run: npm --prefix panel test

      - name: Build panel
        run: npm --prefix panel run build

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore CodeNetix.slnx

      - name: Build solution
        run: dotnet build CodeNetix.slnx -c Release --no-restore

      - name: Run architecture tests (AD-1)
        run: dotnet test --project tests/CodeNetix.ArchitectureTests/CodeNetix.ArchitectureTests.csproj -c Release --no-build

      - name: Build sandbox Docker image
        run: docker build -f docker/sandbox.Dockerfile -t codenetix-sandbox:latest .

      - name: Run host unit and Docker integration tests
        run: dotnet test --project tests/CodeNetix.Host.Tests/CodeNetix.Host.Tests.csproj -c Release --no-build -- --filter-not-trait Category=SecurityFire --fail-skips on

      - name: Run security fire test (Story 2.5)
        run: dotnet test --project tests/CodeNetix.Host.Tests/CodeNetix.Host.Tests.csproj -c Release --no-build -- --filter-trait Category=SecurityFire --fail-skips on

  publish-images:
    runs-on: ubuntu-latest
    needs:
      - verify
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Extract metadata for codenetix image
        id: meta-codenetix
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/n3rvs/codenetix
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Build and push codenetix multi-arch image
        id: build-codenetix
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/codenetix.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-codenetix.outputs.tags }}
          labels: ${{ steps.meta-codenetix.outputs.labels }}
          cache-from: type=gha,scope=codenetix
          cache-to: type=gha,mode=max,scope=codenetix,ignore-error=true

      - name: Sign codenetix image digest with Cosign
        env:
          CODENETIX_DIGEST: ${{ steps.build-codenetix.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${CODENETIX_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Missing or invalid codenetix digest: '${CODENETIX_DIGEST}'." >&2
            exit 1
          fi
          cosign sign --yes --recursive "ghcr.io/n3rvs/codenetix@${CODENETIX_DIGEST}"

      - name: Extract metadata for codenetix-sandbox image
        id: meta-sandbox
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/n3rvs/codenetix-sandbox
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Build and push codenetix-sandbox multi-arch image
        id: build-sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sandbox.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-sandbox.outputs.tags }}
          labels: ${{ steps.meta-sandbox.outputs.labels }}
          cache-from: type=gha,scope=codenetix-sandbox
          cache-to: type=gha,mode=max,scope=codenetix-sandbox,ignore-error=true

      - name: Sign codenetix-sandbox image digest with Cosign
        env:
          SANDBOX_DIGEST: ${{ steps.build-sandbox.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${SANDBOX_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Missing or invalid codenetix-sandbox digest: '${SANDBOX_DIGEST}'." >&2
            exit 1
          fi
          cosign sign --yes --recursive "ghcr.io/n3rvs/codenetix-sandbox@${SANDBOX_DIGEST}"
